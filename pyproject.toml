[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "motiontwin"
version = "0.1.0"
description = "Respiratory motion prediction and simulated needle planning workstation"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.12,<2", "pandas>=2.2,<4",
  "matplotlib>=3.8,<4", "PyYAML>=6,<7", "SimpleITK>=2.3,<3",
  "pyvista>=0.44,<0.49", "vtk>=9.3,<10", "pyvistaqt>=0.11,<0.12",
  "PySide6>=6.7,<7", "torch>=2.4,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
motiontwin = "run:main"

[tool.setuptools]
py-modules = ["motiontwin", "run"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=outputs/cache/test-tmp"
cache_dir = "outputs/cache/pytest"
filterwarnings = ["ignore:.*tight_layout.*:UserWarning"]
