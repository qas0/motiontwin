[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "motiontwin"
version = "0.1.0"
description = "CT imaging and lung reconstruction desktop viewer"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.12,<2", "SimpleITK>=2.3,<3",
  "pyvista>=0.44,<0.49", "vtk>=9.3,<10", "pyvistaqt>=0.11,<0.12",
  "PySide6>=6.7,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
motiontwin = "run:main"

[tool.setuptools]
py-modules = ["motiontwin", "run"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=tests/.tmp"
cache_dir = "tests/.pytest_cache"
